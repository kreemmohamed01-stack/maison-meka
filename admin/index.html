<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dashboard | Maison Meka</title>
<link rel="icon" href="../assets/logo-circle.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="lux.css">
</head>
<body>

<!-- ===== sign in ===== -->
<section class="login" id="login" hidden>
  <form class="login-card" id="loginForm">
    <div class="brand brand-lg"><b>MAISON MEKA</b><small>HOME ART</small></div>
    <h1>Welcome back</h1>
    <p>Sign in to manage your store.</p>
    <label class="fld"><span>Username</span><input type="text" id="loginUser" autocomplete="username" autocapitalize="none" required></label>
    <label class="fld" style="margin-top:12px"><span>Password</span><input type="password" id="loginPw" autocomplete="current-password" required></label>
    <p class="login-err" id="loginErr"></p>
    <button class="btn btn-green btn-block" type="submit">Sign in</button>
  </form>
</section>

<!-- ===== the dashboard ===== -->
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="side-top">
      <div class="brand"><b>MAISON MEKA</b><small>HOME ART</small></div>
      <button class="side-x" id="sideX" aria-label="Close menu"><svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
    </div>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-foot">
      <a class="side-link" href="../index.html" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/></svg><span>View website</span>
      </a>
      <button class="side-link" id="logoutBtn">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a1 1 0 01-1-1V4a1 1 0 011-1h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span>Sign out</span>
      </button>
    </div>
  </aside>
  <div class="side-scrim" id="sideScrim"></div>

  <div class="main">
    <header class="top">
      <button class="top-burger" id="burger" aria-label="Menu"><i></i><i></i><i></i></button>
      <div class="brand brand-top"><b>MAISON MEKA</b><small>HOME ART</small></div>
      <div class="top-right">
        <div class="bell-wrap">
          <button class="bell" id="bell" aria-label="Notifications">
            <svg viewBox="0 0 24 24"><path d="M18 16v-5a6 6 0 10-12 0v5l-2 2h16z"/><path d="M10 20a2 2 0 004 0"/></svg>
            <span class="bell-dot" id="bellDot" hidden></span>
          </button>
          <div class="bell-pop" id="bellPop" hidden></div>
        </div>
        <span class="avatar" aria-label="Maison Meka">MM</span>
      </div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<!-- ===== shared layers ===== -->
<div class="modal" id="modal" hidden><div class="modal-card" id="modalCard"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="filePick" hidden>

<script src="core.js"></script>
<script src="views.js"></script>
<script src="lux.js"></script>
</body>
</html>
