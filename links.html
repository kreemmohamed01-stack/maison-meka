body{

  color:var(--white); text-decoration:none; background:rgba(255,253,249,.06);
  font-size:14px; letter-spacing:3px; text-transform:uppercase; font-weight:400;
  transition:background .35s, color .35s, transform .35s;
}
.links a:hover, .links a:focus-visible{ background:var(--white); color:var(--olive-deep); transform:translateY(-2px); outline:none; }
.links svg{ width:22px; height:22px; flex:none; fill:currentColor; }
.links span{ flex:1; text-align:center; margin-right:38px; }
