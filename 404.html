<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="i18n.js"></script>
<title>Page not found | Maison Meka</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#23201c; --soft:#6d675e; --green:#3f5a3e; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    min-height:100vh; display:grid; place-items:center; padding:24px;
    font-family:'Jost', 'Tajawal', sans-serif; color:var(--ink);
    background:radial-gradient(ellipse at center, #f6f1e8 0%, #ece4d7 100%);
    text-align:center;
  }
  img{ width:120px; height:120px; border-radius:50%; margin:0 auto 26px; display:block; }
  .code{ font:400 14px 'Jost', sans-serif; letter-spacing:.5em; color:#a08f78; }
  h1{ font:500 clamp(36px,8vw,56px)/1.1 'Cormorant Garamond', 'Amiri', serif; margin:14px 0 12px; }
  p{ color:var(--soft); font-weight:300; max-width:380px; margin:0 auto; line-height:1.7; }
  .acts{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:30px; }
  a{ display:inline-flex; align-items:center; height:50px; padding:0 28px; border-radius:999px; text-decoration:none; font-size:15px; }
  .solid{ background:var(--green); color:#fff; }
  .line{ border:1px solid rgba(35,32,28,.25); color:var(--ink); }
  html[lang="ar"] *{ letter-spacing:0 !important; }
</style>
</head>
<body>
  <main>
    <img src="assets/logo-circle.webp" alt="Maison Meka">
    <p class="code">404</p>
    <h1>This page has wandered off</h1>
    <p>The page you were looking for isn't here — but every piece in the house is a click away.</p>
    <div class="acts">
      <a class="solid" href="/index.html">Back to Home</a>
      <a class="line" href="/category.html">Shop the Collection</a>
    </div>
  </main>
</body>
</html>
