<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="i18n.js"></script>
<title>Search | Maison Meka</title>
<meta name="description" content="Search the Maison Meka collection.">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#f5f1e8">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Maison Meka">
<meta property="og:title" content="Search | Maison Meka">
<meta property="og:description" content="Search the Maison Meka collection.">
<meta property="og:image" content="https://maisonmeka.com/assets/og-image.jpg">
<meta property="og:url" content="https://maisonmeka.com/search.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Italiana&family=Marcellus&family=Dancing+Script:wght@400;500;600&family=Jost:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="search.css">
<link rel="stylesheet" href="rtl.css">
</head>
<body class="search-page">

<div class="sp-bg">
  <img loading="lazy" decoding="async" src="assets/search-desktop.webp" alt="" class="bg-desktop">
  <img loading="lazy" decoding="async" src="assets/search-mobile.webp"  alt="" class="bg-mobile">
</div>

<main class="sp-wrap">

  <header class="sp-head">
    <a href="index.html" class="sp-back sp-rise" aria-label="Back to home">
      <svg viewBox="0 0 24 24"><line x1="20" y1="12" x2="5" y2="12"/><polyline points="11 6 5 12 11 18"/></svg>
      <span>HOME</span>
    </a>

    <a href="wishlist.html" class="sp-wish sp-rise" aria-label="Wishlist">
      <svg viewBox="0 0 24 24"><path d="M12 20.5s-7.3-4.7-9.6-9.2C.8 7.9 2.2 4.5 5.4 3.7c1.9-.5 3.9.3 5 1.9.4.7 1 1.5 1.6 1.5s1.2-.8 1.6-1.5c1.1-1.6 3.1-2.4 5-1.9 3.2.8 4.6 4.2 3 7.6C19.3 15.8 12 20.5 12 20.5z"/></svg>
      <span>WISHLIST</span>
    </a>

    <h1 class="sp-title sp-rise">SEARCH</h1>
    <span class="orn orn-sm sp-orn sp-rise"><i></i><b></b><i></i></span>
  </header>

  <div class="sp-bar-row">
    <form class="sp-search sp-rise" id="spForm" onsubmit="return false">
      <span class="sp-mag">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="20.5" y1="20.5" x2="16" y2="16"/></svg>
      </span>
      <input type="search" id="spInput" placeholder="Search for products, categories, styles…" autocomplete="off">
      <button class="sp-go" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="20.5" y1="20.5" x2="16" y2="16"/></svg>
      </button>
    </form>

    <button class="sp-filters sp-rise" id="spFilters">
      <span class="spf-ring">
        <svg viewBox="0 0 24 24"><line x1="4" y1="8" x2="20" y2="8"/><line x1="4" y1="16" x2="20" y2="16"/><circle cx="9" cy="8" r="2.2"/><circle cx="15" cy="16" r="2.2"/></svg>
      </span>
      <span class="spf-label">Filters</span>
    </button>
  </div>

  <div class="sp-meta sp-rise">
    <p class="sp-count"><strong id="spCount">14</strong> Results Found</p>
    <label class="sp-sort">
      <span>Sort by</span>
      <span class="sp-select">
        <select id="spSort">
          <option value="relevance">Relevance</option>
          <option value="low">Price: Low to High</option>
          <option value="high">Price: High to Low</option>
          <option value="name">Name A–Z</option>
        </select>
        <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </span>
    </label>
  </div>

  <div class="sp-grid" id="spGrid"></div>

  <p class="sp-none" id="spNone">No pieces match that search — try another word.</p>

  <footer class="sp-foot sp-rise">
    <svg class="spf-leaf" viewBox="0 0 24 24"><path d="M21 4c0 9-5.5 14-11 14-2 0-4-1-4-1s2-9 9-11c-3 3-4.5 6-5 9"/><path d="M6 20c0-3 1-5 2-6.5"/></svg>
    <span>EXPLORE MORE BEAUTIFUL PIECES</span>
    <svg class="spf-leaf flip" viewBox="0 0 24 24"><path d="M21 4c0 9-5.5 14-11 14-2 0-4-1-4-1s2-9 9-11c-3 3-4.5 6-5 9"/><path d="M6 20c0-3 1-5 2-6.5"/></svg>
  </footer>

</main>

<script src="products.js"></script>
<script src="coupon-popup.js"></script>
<script src="search.js"></script>
</body>
</html>
